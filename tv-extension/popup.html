<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0f1720; --card:#1a2531; --line:#2a3a4a; --text:#e6edf3; --dim:#8ba0b3; --accent:#2f81f7; --ok:#2ea043; --err:#f85149; }
  * { box-sizing:border-box; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  body { width:340px; margin:0; background:var(--bg); color:var(--text); font-size:13px; }
  .wrap { padding:12px; }
  h1 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  label { display:block; color:var(--dim); font-size:11px; margin:6px 0 3px; }
  input, select, button { width:100%; padding:8px; border-radius:6px; border:1px solid var(--line); background:#0d141c; color:var(--text); font-size:13px; }
  button { background:var(--accent); border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:8px; }
  button.secondary { background:#243244; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .zone { display:flex; justify-content:space-between; padding:5px 8px; border:1px solid var(--line); border-radius:6px; margin-top:5px; background:#0d141c; }
  .muted { color:var(--dim); font-size:11px; }
  .status { margin-top:8px; font-size:12px; min-height:16px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .hidden { display:none; }
  a { color:var(--accent); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ Command0r Zones</h1>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <label>Firebase email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button id="saveLogin">Save & sign in</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- MAIN -->
  <div class="card hidden" id="mainCard">
    <div class="row">
      <button id="readBtn">Read chart zones</button>
      <button class="secondary" id="signout" style="flex:0 0 90px;">Sign out</button>
    </div>
    <div id="tvInfo" class="muted" style="margin-top:8px;"></div>
    <div id="zoneList"></div>

    <label>Account</label>
    <select id="account"></select>

    <label>MT5 symbol (type to search)</label>
    <input id="mt5symbol" list="symlist" placeholder="e.g. Volatility 10 Index" autocomplete="off">
    <datalist id="symlist"></datalist>

    <button id="sendBtn" disabled>Send zones to Command0r</button>
    <div class="status" id="sendStatus"></div>
  </div>

  <div class="muted">Open a TradingView chart, draw your rectangle zones, then Read → pick the MT5 symbol → Send.</div>
</div>
<script src="popup.js"></script>
</body>
</html>
